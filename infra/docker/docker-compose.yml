name: misa-flipbook

# P1: postgres, redis, migrate (one-shot), api, dispatcher, pdf-worker.
# CHUA co: proxy (nginx) va apps/web (Next.js) - chua co UI/reader de phuc vu, se
# them o P2/P3 khi co gi do that su can proxy. Ghi ro trong MEMORYBANK.md, khong
# tu nhan da xong toan bo "Docker Compose pilot" cua ARCHITECTURE.md muc 8.
#
# Chi postgres/redis mo port ra 127.0.0.1 de dev/test cuc bo; api mo port de goi
# thu (chua co proxy). dispatcher/pdf-worker KHONG mo port ra host - chi goi duoc
# tu trong mang cua compose (ARCHITECTURE.md: "DB/Redis/worker dung mang noi bo").

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?can dat POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-misa_flipbook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../migrations
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-misa_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-misa_flipbook}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?can dat APP_DB_PASSWORD trong .env}

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-misa_flipbook}
      # SEC-03: rate limit dang nhap/mat khau sach (xem common/rate-limit) - dung chung
      # instance Redis voi dispatcher/worker-convert, khong them ha tang moi.
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?can dat JWT_SECRET trong .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      STORAGE_ROOT: /data/storage
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-209715200}
      PDF_UPLOAD_CONCURRENCY: ${PDF_UPLOAD_CONCURRENCY:-4}
      PDF_UPLOAD_TIMEOUT_MS: ${PDF_UPLOAD_TIMEOUT_MS:-120000}
      SHARE_THUMBNAIL_MAX_BYTES: ${SHARE_THUMBNAIL_MAX_BYTES:-8388608}
      SHARE_THUMBNAIL_TIMEOUT_MS: ${SHARE_THUMBNAIL_TIMEOUT_MS:-60000}
      PDF_WORKER_URL: http://pdf-worker:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?can dat INTERNAL_API_TOKEN trong .env}
      TENANT_SOURCE_BYTES: ${TENANT_SOURCE_BYTES:-10737418240}
      TENANT_PENDING_JOBS: ${TENANT_PENDING_JOBS:-20}
      PDF_PIPELINE_VERSION: ${PDF_PIPELINE_VERSION:-v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      PORT: "3000"
    volumes:
      - storage_data:/data/storage
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # web (FE): app Next.js RIENG, chi goi api qua HTTP/JSON (Bearer JWT, CORS) -
  # khong SSR-proxy, khong dung chung process/DB voi BE ("tach rieng FE va BE").
  # NEXT_PUBLIC_API_BASE_URL phai la URL trinh duyet cua NGUOI DUNG goi toi duoc
  # (vd http://localhost:3000 khi test tren may dev) - KHONG dung hostname noi bo
  # cua Docker network (vd http://api:3000), vi trinh duyet chay ngoai mang do.
  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${WEB_PUBLIC_API_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${WEB_PUBLIC_FACEBOOK_APP_ID:-}
    environment:
      # F08: generateMetadata (Open Graph, server-side) chay code TRONG container web,
      # phai goi thang toi service "api" qua Docker network noi bo - khac han
      # NEXT_PUBLIC_API_BASE_URL o tren (URL cho TRINH DUYET nguoi dung, xem chu thich
      # phia tren). Bien runtime thuong (khong NEXT_PUBLIC_), khong bi inline luc build.
      API_INTERNAL_BASE_URL: http://api:3000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pdf-worker:
    build:
      context: ../../services/pdf-worker
    restart: unless-stopped
    environment:
      STORAGE_ROOT: /data/storage
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?can dat INTERNAL_API_TOKEN trong .env}
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-209715200}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-500}
      PDF_MAX_PAGE_PIXELS: ${PDF_MAX_PAGE_PIXELS:-8000000}
      PDF_MAX_OUTPUT_BYTES: ${PDF_MAX_OUTPUT_BYTES:-536870912}
      PDF_PROCESS_MEMORY_MB: ${PDF_PROCESS_MEMORY_MB:-512}
      PDF_MAX_PROCESSES: ${PDF_MAX_PROCESSES:-1}
      PDF_TIMEOUT_SECONDS: ${PDF_TIMEOUT_SECONDS:-600}
      SHARE_THUMBNAIL_MAX_PIXELS: ${SHARE_THUMBNAIL_MAX_PIXELS:-32000000}
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - storage_data:/data/storage
    # KHONG publish port ra host - chi dispatcher (cung mang compose) goi duoc.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
          pids: 64

  # dispatcher: CHI claim job tu Postgres outbox roi day vao BullMQ/Redis - khong
  # goi pdf-worker, khong xu ly. Neu code xu ly (worker-convert) co bug/crash, claim
  # loop nay khong bi anh huong - job moi van tiep tuc duoc dua vao hang doi.
  dispatcher:
    build:
      context: ../../apps/dispatcher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-misa_flipbook}
      REDIS_URL: redis://redis:6379
      POLL_INTERVAL_MS: ${DISPATCHER_POLL_INTERVAL_MS:-2000}
      RECONCILE_INTERVAL_MS: ${DISPATCHER_RECONCILE_INTERVAL_MS:-60000}
      JOB_ATTEMPTS: ${DISPATCHER_JOB_ATTEMPTS:-3}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # worker-convert: tien trinh DUY NHAT goi pdf-worker va ghi ket qua job. Tach khoi
  # dispatcher de co lo hong loi that su (xem apps/worker-convert/src/index.js).
  # Co the scale ra nhieu instance (Worker cung queue) neu can throughput cao hon,
  # ma khong dung gi den dispatcher/api.
  worker-convert:
    build:
      context: ../../apps/worker-convert
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pdf-worker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-misa_flipbook}
      REDIS_URL: redis://redis:6379
      PDF_WORKER_URL: http://pdf-worker:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      STORAGE_ROOT: /data/storage
      CONCURRENCY: ${WORKER_CONVERT_CONCURRENCY:-2}
      JOB_ATTEMPTS: ${DISPATCHER_JOB_ATTEMPTS:-3}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      PDF_TIMEOUT_SECONDS: ${PDF_TIMEOUT_SECONDS:-600}
    volumes:
      - storage_data:/data/storage
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
  redisdata:
  storage_data:
