server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 201m;

    # Do not set X-Frame-Options: public /embed is an explicit product feature.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Reader grants can be present in a query string. Never include that path/query
    # in the Referer header when a reader follows an external PDF hyperlink.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:3000/health;
    }

    location /api/ {
        # Strip only the public proxy prefix. Nginx itself has no cache configured,
        # therefore Cache-Control from API remains the reader authorization policy.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately overwrite client-provided XFF. App trusts exactly this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:3000/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:3001;
    }
}
